<template>
    <lightning-card>

        <div slot="title">
            <span class="slds-text-heading_small">
                <strong>{assessmentType}</strong>
            </span>
        </div>

        <!-- Edit Pencil -->
        <div slot="actions">
            <template if:false={isEditMode}>
                <template if:false={isCompleted}>
                <lightning-button-icon                
                    icon-name="utility:edit"
                    alternative-text="Edit Assessment"
                    title="Edit Assessment"
                    onclick={handleEdit}>
                </lightning-button-icon>
                </template>
                
                <template if:false={isCompleted}>
                <lightning-button-icon
                    icon-name="utility:copy"
                    class="slds-p-left_medium"
                    alternative-text="Clone Assessment"
                    title="Clone Assessment"
                    onclick={handleClone}>
                </lightning-button-icon>
                </template>

                <lightning-button-icon
                    icon-name="utility:delete"
                    class="slds-p-left_medium"
                    alternative-text="Delete Assessment"
                    title="Delete Assessment"
                    onclick={handleDelete}>
                </lightning-button-icon>

<template if:false={isCompleted}>
                <lightning-button-icon
            icon-name="utility:print"
            class="slds-p-left_medium"
            alternative-text="Generate PDF"
            title="Generate PDF"
            onclick={handleGeneratePdf}>
        </lightning-button-icon>
</template>

        <template if:true={isDraft}>

    <lightning-button
        class="slds-p-left_medium"
        label="Complete Assessment"
        variant="brand"
        onclick={handleComplete}>
    </lightning-button>

</template>
            </template>
<template if:true={isEditMode}>
             <lightning-button
                            label="Cancel"
                            onclick={handleCancelEdit}>
                        </lightning-button>

                        <lightning-button
                            class="slds-m-left_small"
                            variant="brand"
                            label="Save Changes"
                            onclick={handleSave}>
                        </lightning-button>
</template>
            </div>
        <!-- Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading Assessment"
                size="medium">
            </lightning-spinner>
        </template>

        <!-- Questions -->
        <template if:true={questions.length}>
            
            <div class="slds-p-around_medium">
                
                    <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                        <div class="slds-col slds-size_1-of-2 slds-text-heading_small">
                            <strong>Client's Name:</strong>
                            <span class="slds-m-left_x-small slds-text-heading_small">
                                {clientName}
                            </span>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-text-heading_small">
                            <strong>Created Date:</strong>
                            <span class="slds-m-left_x-small slds-text-heading_small">
                                {assessmentDate}
                            </span>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-text-heading_small">
                            <strong>Status:</strong>
                            <span class="slds-m-left_x-small">
                                {assessmentStatus}
                            </span>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-text-heading_small">
                            <strong>Last Modified:</strong>
                            <span class="slds-m-left_x-small slds-text-heading_small">
                                {lastModifiedDate}
                            </span>
                        </div>

                    </div>
                <template if:true={isGeriatricDepressionScale}>
                    <div class="slds-m-bottom_medium">
                        <p class="slds-text-heading_small">
                            Please select the best answer for how you've felt over the past week.
                        </p>
                    </div>
                </template>
<template if:true={isHomeFromHospitalAssessment}>
    <div class="slds-m-bottom_medium">
           <b> Please score 1-5 (1 = excellent, 2 = good, 3 = fair, 4 = average,  5 = poor) </b>        
    </div>
</template>

<template if:true={isKatzADLAssessment}>
    <div class="slds-m-top_medium slds-m-bottom_medium">
        <p>
            For each area of functioning listed below, check which
            description applies (note: the word “assistance” means
            supervision, direction or personal assistance).
        </p>
    </div>
</template>


<template if:true={isFamilyCaregiverAssessment}>
    <div class="slds-m-top_medium slds-p-bottom_medium">
        <strong>
            Please indicate on a scale of 1–5
            (1 = Excellent, 2 = Good, 3 = Fair, 4 = Average, 5 = Poor)
        </strong>
    </div>
</template>

<template if:true={isQualityOfLifeTPA}>
    <div class="slds-m-top_medium slds-p-bottom_medium">
        <strong>
            Personal Interest Inventory
        </strong>
    </div>
</template>

<template if:true={isMedicationManagementAssessment}>
    <div class="slds-m-top_medium slds-p-bottom_medium">
        <strong>
            Use this tool at intake, quarterly care plan updates, or with any change in condition. Your role is to identify risks, educate the client/family, and flag issues. You are not expected to solve medication problems directly. If issues are identified, ask the client/family whether they want the care manager to reach out to the prescribing provider or pharmacy.
        </strong>
    </div>
</template>

<!-- Caregiver Trigger Question -->
<template if:true={caregiverTriggerQuestion}>

    <div class="slds-box slds-theme_default slds-m-bottom_large">

        <div class="slds-text-heading_small slds-m-bottom_small">
            <strong>                
                {caregiverTriggerQuestion.questionText}
            </strong>
        </div>

        <lightning-textarea
            data-id={caregiverTriggerQuestion.id}
            value={caregiverTriggerQuestion.answer}
            disabled={isReadOnly}
            onchange={handleAnswerChange}>
        </lightning-textarea>

    </div>

</template>


<!-- Section-Based Assessments -->
<template if:true={hasSections}>

    <lightning-accordion
        allow-multiple-sections-open
        active-section-name={activeSections}>

        <template
            for:each={sections}
            for:item="section">

            <lightning-accordion-section
                key={section.name}
                name={section.name}
                label={section.name}>

    <div class="slds-text-body_small slds-m-bottom_small">
        <b>To perform this assessment, seat the patient in a hard, armless chair.</b>
    </div>
</template>

<template if:true={section.isGaitSection}>
    <div class="slds-text-body_small slds-m-bottom_small">
        <b>Stand with the patient. Walk across the room (+/- aids) at a usual pace, then rapidly.</b>
    </div>
</template>
