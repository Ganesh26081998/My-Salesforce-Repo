<template>
    <lightning-modal-header
        label="Confirm Action">
    </lightning-modal-header>

    <lightning-modal-body>
        <p>{message}</p>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            label="No"
            onclick={handleCancel}>
        </lightning-button>

        <lightning-button
            class="slds-m-left_small"
            variant="brand"
            label="Yes"
            onclick={handleConfirm}>
        </lightning-button>
    </lightning-modal-footer>
</template>
