<template>
    <lightning-card title="All Care Plans">
        <div class="slds-m-around_medium">
            <template if:true={carePlans}>
                <lightning-datatable
                    class="custom-datatable"
                    key-field="Id"
                    data={carePlans}
                    columns={columns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>

            <template if:false={carePlans.length}>
                <div class="slds-text-align_center slds-p-around_large">
                    <p class="slds-text-color_weak">No Care Plans found for this account.</p>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Delete Confirmation Modal -->
    <template if:true={showDeleteModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Delete Care Plan</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Are you sure you want to delete this Care Plan?</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Delete" onclick={confirmDelete} class="delete-Button"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Edit Modal -->
    <template if:true={showEditModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{selectedRecordTitle}</h2>
                    <lightning-button-icon
                        icon-name="utility:close"
                        size="large"
                        alternative-text="Close"
                        variant="bare"
                        onclick={closeEditModal}
                        class="slds-modal__close close-modal-button">
                    </lightning-button-icon>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <c-care-plan-edit
                        record-id={selectedRecordId}
                        onclose={handleEditClose}>
                    </c-care-plan-edit>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
