<template>
    <lightning-card>

        <!-- Loader -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <div class="notes-wrapper">

            <!-- Top Bar -->
            <div class="top-bar">
                <div class="show-entries">
                    Show
                    <select class="entries-select" onchange={handlePageSizeChange}>
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    entries
                </div>

                <div class="top-right">
                    <span class="search-label">Search:</span>
                    <input
                        type="text"
                        class="search-input"
                        value={searchKey}
                        onkeyup={handleSearchKeyUp}
                    />
                    <button class="btn-go" onclick={handleGoSearch}>Go</button>
                    <button class="btn-new" onclick={handleNewClick}>New</button>
                </div>
            </div>

            <!-- Create Note Form -->
            <template if:true={showCreateForm}>
                <div class="create-form-panel">

                    <lightning-input
                        label="Title"
                        value={name}
                        onchange={handleNameChange}>
                    </lightning-input>

                    <div style="font-size:13px; font-weight:700; color:#3e3e3c; margin-top:8px; margin-bottom:4px;">
                        Description
                    </div>

                    <lightning-input-rich-text
                        variant="label-hidden"
                        value={description}
                        onchange={handleDescriptionChange}>
                    </lightning-input-rich-text>

                    <div class="form-buttons">
                        <lightning-button
                            label="Save Note"
                            variant="brand"
                            onclick={handleSave}
                            disabled={isLoading}>
                        </lightning-button>

                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCancel}
                            class="slds-m-left_small">
                        </lightning-button>
                    </div>

                </div>
            </template>

            <!-- Notes Table -->
            <table class="notes-table">
                <thead>
                    <tr>
                        <th class="th-date" onclick={handleSort} style="cursor:pointer;">
                            Date
                            <span class="sort-arrow">
                                <template if:true={isAsc}>▲</template>
                                <template if:false={isAsc}>▼</template>
                            </span>
                        </th>
                        <th class="th-desc">Description</th>
                    </tr>
                </thead>

                <tbody>
                    <template if:true={hasPagedNotes}>
                        <template for:each={pagedNotes} for:item="note">
                            <tr key={note.Id} class="note-row">

                                <td class="td-date">
                                    {note.DateFormatted}
                                    <!-- <lightning-formatted-date-time
                                        value={note.Date__c}
                                        month="2-digit"
                                        day="2-digit"
                                        year="numeric">
                                    </lightning-formatted-date-time> -->
                                </td>

                                <td class="td-desc">

                                    <div class="note-title">
                                        <a href={note.noteUrl} class="title-link">{note.Name}</a>
                                    </div>

                                    <template if:true={note.hasDescription}>
                                        <div class={note.descClass}>
                                            <lightning-formatted-rich-text
                                                value={note.Descriptions__c}>
                                            </lightning-formatted-rich-text>
                                        </div>

                                        <template if:true={note.showToggle}>
                                            <span
                                                class="toggle-link"
                                                data-id={note.Id}
                                                onclick={toggleDescription}>
                                                {note.toggleText}
                                            </span>
                                        </template>
                                    </template>

                                    <template if:true={note.CreatedByName}>
                                        <div class="note-meta">
                                            Created by <b>{note.CreatedByName}</b>
                                            <span> on </span>

                                            <!-- <lightning-formatted-date-time
                                                value={note.CreatedDate}
                                                month="short"
                                                day="2-digit"
                                                year="numeric"
                                                hour="2-digit"
                                                minute="2-digit"
                                                >
                                            </lightning-formatted-date-time> -->
                                        <span>{note.CreatedDateFormatted}</span>

     

                                        </div>
                                    </template>

                                </td>
                            </tr>
                        </template>
                    </template>

                    <template if:false={hasPagedNotes}>
                        <tr>
                            <td colspan="2" class="no-records">
                                No records found.
                            </td>
                        </tr>
                    </template>

                </tbody>
            </table>

            <!-- Footer -->
            <div class="table-footer">
                <span>{footerText}</span>

                <div class="pagination-controls">
                    <button onclick={handlePrevPage} disabled={isFirstPage}>
                        Previous
                    </button>

                    <span>Page {currentPage} of {totalPages}</span>

                    <button onclick={handleNextPage} disabled={isLastPage}>
                        Next
                    </button>
                </div>
            </div>

        </div>

    </lightning-card>
</template>
