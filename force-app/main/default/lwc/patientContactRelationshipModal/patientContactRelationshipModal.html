    <template if:true={showDuplicateWarning}>
    

    <div class="slds-notify slds-scoped-notification slds-notify_alert slds-theme_warning slds-m-bottom_medium" role="alert">
        <span class="slds-assistive-text">warning</span>
        <lightning-icon icon-name="utility:warning" alternative-text="Warning"
            size="small" class="slds-m-right_small"></lightning-icon>
        <h2>
            <strong>Duplicate found.</strong> A similar contact already exists. Save anyway?
        </h2>
    </div>   
    </template> 


    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
        <div class="slds-col"></div>
        <div class="slds-col slds-no-flex">
            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>

            <template if:false={showDuplicateWarning}>
                <lightning-button
                    class="slds-m-left_small"
                    variant="brand"
                    label="Save"
                    onclick={handleSave}>
                </lightning-button>
            </template>

            <template if:true={showDuplicateWarning}>
                <lightning-button
                    class="slds-m-left_small"
                    variant="brand"
                    label="Save Anyway"
                    onclick={handleDuplicateConfirm}>
                </lightning-button>
                <lightning-button
                    class="slds-m-left_small"
                    variant="destructive-text"
                    label="Discard"
                    onclick={handleDuplicateCancel}>
                </lightning-button>
            </template>
        </div>
    </div>
